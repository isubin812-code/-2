<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가계부</title>
  <style>
    /* ===== 초기화 & 기본 ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                   "Malgun Gothic", "맑은 고딕", sans-serif;
      background: #f5f7fb;
      color: #222;
      min-height: 100vh;
      padding: 16px;
    }

    /* ===== 헤더 ===== */
    header.app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    header.app-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header.app-header h1 span.icon { font-size: 1.3rem; }
    .month-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .month-nav button {
      width: 36px; height: 36px;
      border: none;
      border-radius: 50%;
      background: #eef2f7;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .month-nav button:hover { background: #dbe3ec; }
    .month-nav .month-label {
      font-size: 1rem;
      font-weight: 600;
      min-width: 120px;
      text-align: center;
      color: #374151;
    }

    /* ===== 요약 카드 ===== */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      text-align: center;
    }
    .summary-card .label {
      font-size: 0.8rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .summary-card .value {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .summary-card.income .value { color: #2563eb; }
    .summary-card.expense .value { color: #dc2626; }
    .summary-card.balance .value { color: #1f2937; }
    .summary-card.balance.negative .value { color: #dc2626; }

    /* ===== 레이아웃: 입력 + 목록 ===== */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 700px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .panel h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== 입력 폼 ===== */
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 4px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .type-toggle button {
      flex: 1;
      padding: 10px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .type-toggle button.active-income {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .type-toggle button.active-expense {
      border-color: #dc2626;
      background: #fef2f2;
      color: #b91c1c;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    /* ===== 내역 목록 ===== */
    .list-section { min-height: 200px; }
    .transaction-list {
      list-style: none;
      max-height: 380px;
      overflow-y: auto;
    }
    .transaction-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.92rem;
    }
    .transaction-list li:last-child { border-bottom: none; }
    .tx-info { display: flex; flex-direction: column; gap: 2px; }
    .tx-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tx-category {
      font-size: 0.75rem;
      background: #eef2f7;
      color: #4b5563;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }
    .tx-amount.income { color: #2563eb; font-weight: 700; }
    .tx-amount.expense { color: #dc2626; font-weight: 700; }
    .tx-date { font-size: 0.78rem; color: #9ca3af; }
    .tx-actions { display: flex; gap: 6px; }
    .tx-actions button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .tx-actions .btn-edit { color: #2563eb; }
    .tx-actions .btn-edit:hover { background: #eff6ff; }
    .tx-actions .btn-delete { color: #dc2626; }
    .tx-actions .btn-delete:hover { background: #fef2f2; }
    .empty-list {
      text-align: center;
      color: #9ca3af;
      padding: 30px 10px;
      font-size: 0.9rem;
    }
    .empty-list .empty-icon { font-size: 2rem; margin-bottom: 8px; }

    /* ===== 통계 패널 ===== */
    .stat-panel { margin-bottom: 16px; }
    .chart-wrap {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .donut-container {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
      flex-shrink: 0;
    }
    .donut-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .donut-center .donut-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1f2937;
    }
    .donut-center .donut-label {
      font-size: 0.7rem;
      color: #6b7280;
    }
    .donut-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .donut-legend {
      flex: 1;
      min-width: 180px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 0.85rem;
    }
    .legend-item:last-child { border-bottom: none; }
    .legend-color {
      width: 12px; height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .legend-name { flex: 1; color: #374151; }
    .legend-amount { font-weight: 600; color: #1f2937; }
    .legend-pct { color: #9ca3af; font-size: 0.78rem; margin-left: 4px; }

    /* ===== 하단 버튼 ===== */
    .btn-bottom {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .btn-secondary {
      padding: 8px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      color: #4b5563;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-danger {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #dc2626;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-danger:hover { background: #b91c1c; }

    /* 스크롤바 */
    .transaction-list::-webkit-scrollbar { width: 8px; }
    .transaction-list::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- ===== 헤더 ===== -->
  <header class="app-header">
    <h1><span class="icon">📒</span> 가계부</h1>
    <div class="month-nav">
      <button id="prevMonth" aria-label="이전 달">◀</button>
      <div class="month-label" id="monthLabel">2026년 11월</div>
      <button id="nextMonth" aria-label="다음 달">▶</button>
    </div>
  </header>

  <!-- ===== 요약 ===== -->
  <section class="summary-row">
    <div class="summary-card income">
      <div class="label">총 수입</div>
      <div class="value" id="totalIncome">0원</div>
    </div>
    <div class="summary-card expense">
      <div class="label">총 지출</div>
      <div class="value" id="totalExpense">0원</div>
    </div>
    <div class="summary-card balance" id="balanceCard">
      <div class="label">잔액</div>
      <div class="value" id="balance">0원</div>
    </div>
  </section>

  <!-- ===== 메인 그리드 ===== -->
  <div class="main-grid">
    <!-- 입력 패널 -->
    <section class="panel">
      <h2>✏️ 내역 추가</h2>
      <form id="entryForm" autocomplete="off">
        <div class="type-toggle">
          <button type="button" id="typeIncome" class="active-income">수입</button>
          <button type="button" id="typeExpense">지출</button>
        </div>
        <input type="hidden" id="entryType" value="income">

        <div class="form-group">
          <label for="amount">금액</label>
          <input type="number" id="amount" min="0" step="100" placeholder="금액을 입력하세요" required>
        </div>

        <div class="form-group">
          <label for="category">카테고리</label>
          <select id="category" required></select>
        </div>

        <div class="form-group">
          <label for="content">내용</label>
          <input type="text" id="content" placeholder="어디에 썼는지 / 어디서 벌었는지" maxlength="50">
        </div>

        <div class="form-group">
          <label for="date">날짜</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">추가하기</button>
      </form>
    </section>

    <!-- 목록 패널 -->
    <section class="panel list-section">
      <h2>📋 내역 목록</h2>
      <ul class="transaction-list" id="txList"></ul>
    </section>
  </div>

  <!-- ===== 통계 ===== -->
  <section class="panel stat-panel">
    <h2>📊 카테고리별 지출 통계</h2>
    <div class="chart-wrap">
      <div class="donut-container">
        <svg class="donut-svg" id="donutSvg" viewBox="0 0 120 120"></svg>
        <div class="donut-center">
          <div class="donut-value" id="donutTotal">0원</div>
          <div class="donut-label">총 지출</div>
        </div>
      </div>
      <div class="donut-legend" id="legendContainer"></div>
    </div>
  </section>

  <!-- ===== 하단 ===== -->
  <div class="btn-bottom">
    <button class="btn-secondary" id="btnAddSample">샘플 데이터 추가</button>
    <button class="btn-danger" id="btnClearAll">모든 데이터 삭제</button>
  </div>

  <script>
    (function() {
      'use strict';

      // ===== 상수 =====
      const STORAGE_KEY = 'household_accountbook_data';
      const COLORS = [
        '#dc2626', '#f97316', '#eab308', '#2563eb',
        '#7c3aed', '#0891b2', '#16a34a', '#ec4899',
        '#6b7280', '#1f2937', '#8b5cf6', '#0d9488'
      ];

      const EXPENSE_CATEGORIES = [
        { value: 'food', label: '식비' },
        { value: 'transport', label: '교통비' },
        { value: 'housing', label: '주거비' },
        { value: 'culture', label: '문화/여가' },
        { value: 'shopping', label: '쇼핑' },
        { value: 'medical', label: '의료비' },
        { value: 'education', label: '교육비' },
        { value: 'communication', label: '통신/구독' },
        { value: 'other', label: '기타' }
      ];

      const INCOME_CATEGORIES = [
        { value: 'salary', label: '급여' },
        { value: 'business', label: '사업소득' },
        { value: 'allowance', label: '용돈' },
        { value: 'interest', label: '이자/투자' },
        { value: 'other', label: '기타 수입' }
      ];

      const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월',
                           '7월','8월','9월','10월','11월','12월'];

      // ===== 상태 =====
      let currentDate = new Date();       // 조회 중 기준 날짜
      let viewYear  = currentDate.getFullYear();
      let viewMonth = currentDate.getMonth(); // 0-based
      let entries = [];                    // 전체 내역
      let isIncome = true;                 // 현재 선택 타입

      // ===== DOM =====
      const $ = (id) => document.getElementById(id);
      const monthLabel   = $('monthLabel');
      const prevBtn      = $('prevMonth');
      const nextBtn      = $('nextMonth');
      const totalIncome  = $('totalIncome');
      const totalExpense = $('totalExpense');
      const balanceEl    = $('balance');
      const balanceCard  = $('balanceCard');
      const txList       = $('txList');
      const entryForm    = $('entryForm');
      const entryType    = $('entryType');
      const typeIncomeBtn= $('typeIncome');
      const typeExpenseBtn=$('typeExpense');
      const amountInput  = $('amount');
      const categorySel  = $('category');
      const contentInput = $('content');
      const dateInput    = $('date');
      const btnSubmit    = $('btnSubmit');
      const donutSvg     = $('donutSvg');
      const donutTotal   = $('donutTotal');
      const legendContainer = $('legendContainer');
      const btnAddSample = $('btnAddSample');
      const btnClearAll  = $('btnClearAll');

      // ===== 유틸 =====
      function fmtCurrency(n) {
        return Math.round(n).toLocaleString('ko-KR') + '원';
      }
      function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso + 'T00:00:00');
        return `${d.getFullYear()}년 ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}일`;
      }
      function todayISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const day = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${day}`;
      }
      function monthStart(y, m) {
        return new Date(y, m, 1);
      }
      function monthEnd(y, m) {
        return new Date(y, m + 1, 0, 23, 59, 59);
      }
      function inCurrentView(entry) {
        const d = new Date(entry.date + 'T00:00:00');
        return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
      }

      // ===== 데이터 =====
      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          entries = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(entries)) entries = [];
        } catch (e) {
          entries = [];
        }
        // 날짜 기준 정렬 (최신순)
        entries.sort((a, b) => new Date(b.date) - new Date(a.date));
      }
      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }

      // ===== 카테고리 채우기 =====
      function populateCategories() {
        const list = isIncome ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
        categorySel.innerHTML = '';
        list.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.value;
          opt.textContent = cat.label;
          categorySel.appendChild(opt);
        });
      }

      // ===== 타입 토글 =====
      function setType(income) {
        isIncome = income;
        entryType.value = income ? 'income' : 'expense';
        typeIncomeBtn.classList.toggle('active-income', income);
        typeIncomeBtn.classList.toggle('active-expense', !income);
        typeExpenseBtn.classList.toggle('active-income', !income);
        typeExpenseBtn.classList.toggle('active-expense', income);
        populateCategories();
      }
      typeIncomeBtn.addEventListener('click', () => setType(true));
      typeExpenseBtn.addEventListener('click', () => setType(false));

      // ===== 월별 요약 계산 =====
      function computeMonthlySummary() {
        let incomeSum = 0, expenseSum = 0;
        const catSums = {}; // expense 카테고리별 합계
        entries.forEach(e => {
          if (!inCurrentView(e)) return;
          const amt = Number(e.amount) || 0;
          if (e.type === 'income') {
            incomeSum += amt;
          } else {
            expenseSum += amt;
            catSums[e.category] = (catSums[e.category] || 0) + amt;
          }
        });
        return { incomeSum, expenseSum, catSums };
      }

      // ===== 요약 표시 =====
      function renderSummary() {
        const { incomeSum, expenseSum, catSums } = computeMonthlySummary();
        totalIncome.textContent = fmtCurrency(incomeSum);
        totalExpense.textContent = fmtCurrency(expenseSum);
        const balance = incomeSum - expenseSum;
        balanceEl.textContent = (balance >= 0 ? '+' : '') + fmtCurrency(balance);
        balanceCard.classList.toggle('negative', balance < 0);
        renderDonut(catSums, expenseSum);
      }

      // ===== 도넛 차트 =====
      function renderDonut(catSums, total) {
        donutTotal.textContent = fmtCurrency(total);
        legendContainer.innerHTML = '';

        if (total === 0 || Object.keys(catSums).length === 0) {
          donutSvg.innerHTML = '';
          const emptyMsg = document.createElement('div');
          emptyMsg.style.cssText = 'width:100%;text-align:center;color:#9ca3af;padding:30px;font-size:0.9rem;';
          emptyMsg.textContent = '지출 내역이 없습니다.';
          legendContainer.appendChild(emptyMsg);
          return;
        }

        // 카테고리별 정렬 (큰 순서)
        const sorted = Object.entries(catSums)
          .sort((a, b) => b[1] - a[1])
          .map(([key, val]) => {
            const cat = EXPENSE_CATEGORIES.find(c => c.value === key) || { label: key };
            return { key, label: cat.label, value: val };
          });

        const totalVal = sorted.reduce((s, x) => s + x.value, 0);
        let cumulative = 0;
        donutSvg.innerHTML = '';
        const cx = 60, cy = 60, r = 50, strokeW = 18;

        sorted.forEach((item, idx) => {
          const pct = item.value / totalVal;
          const angleStart = (cumulative / totalVal) * 360 - 90;
          const angleEnd = ((cumulative + item.value) / totalVal) * 360 - 90;
          cumulative += item.value;

          const startRad = (angleStart * Math.PI) / 180;
          const endRad   = (angleEnd * Math.PI) / 180;

          const x1 = cx + r * Math.cos(startRad);
          const y1 = cy + r * Math.sin(startRad);
          const x2 = cx + r * Math.cos(endRad);
          const y2 = cy + r * Math.sin(endRad);

          const largeArc = (endRad - startRad + 2 * Math.PI) % (2 * Math.PI) > Math.PI ? 1 : 0;

          const d = `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`;
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', d);
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', COLORS[idx % COLORS.length]);
          path.setAttribute('stroke-width', strokeW);
          path.setAttribute('stroke-linecap', 'round');
          donutSvg.appendChild(path);

          // 범례
          const li = document.createElement('div');
          li.className = 'legend-item';
          li.innerHTML = `
            <span class="legend-color" style="background:${COLORS[idx % COLORS.length]}"></span>
            <span class="legend-name">${item.label}</span>
            <span class="legend-amount">${fmtCurrency(item.value)}</span>
            <span class="legend-pct">(${((item.value/totalVal)*100).toFixed(1)}%)</span>
          `;
          legendContainer.appendChild(li);
        });
      }

      // ===== 내역 목록 표시 =====
      function renderList() {
        txList.innerHTML = '';
        const viewEntries = entries.filter(inCurrentView);

        if (viewEntries.length === 0) {
          txList.innerHTML = `
            <div class="empty-list">
              <div class="empty-icon">📭</div>
              ${viewYear}년 ${MONTH_NAMES[viewMonth]}의 내역이 없습니다.
            </div>`;
          return;
        }

        viewEntries.forEach((entry, idx) => {
          const li = document.createElement('li');
          const isInc = entry.type === 'income';
          const catLabel = (isInc
            ? INCOME_CATEGORIES.find(c => c.value === entry.category)
            : EXPENSE_CATEGORIES.find(c => c.value === entry.category)
          )?.label || entry.category;

          li.innerHTML = `
            <div class="tx-info">
              <div class="tx-main">
                <span class="tx-category">${catLabel}</span>
                <span class="tx-amount ${isInc ? 'income' : 'expense'}">
                  ${isInc ? '+' : '-'}${fmtCurrency(Number(entry.amount))}
                </span>
              </div>
              <div class="tx-date">${fmtDate(entry.date)} · ${entry.content || ''}</div>
            </div>
            <div class="tx-actions">
              <button class="btn-edit" data-idx="${idx}" data-viewidx="${viewEntries.indexOf(entry)}">수정</button>
              <button class="btn-delete" data-idx="${idx}" data-viewidx="${viewEntries.indexOf(entry)}">삭제</button>
            </div>
          `;
          txList.appendChild(li);
        });

        // 이벤트 위임: 수정 / 삭제
        txList.querySelectorAll('.btn-edit').forEach(btn => {
          btn.addEventListener('click', () => {
            const realIdx = Number(btn.dataset.idx);
            openEdit(realIdx);
          });
        });
        txList.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', () => {
            const realIdx = Number(btn.dataset.idx);
            deleteEntry(realIdx);
          });
        });
      }

      // ===== 수정 =====
      function openEdit(realIdx) {
        const e = entries[realIdx];
        if (!e) return;
        isIncome = e.type === 'income';
        setType(isIncome);
        amountInput.value = e.amount;
        contentInput.value = e.content || '';
        dateInput.value = e.date;

        // 선택된 카테고리 선택
        populateCategories();
        categorySel.value = e.category;

        // 기존 submit 취소 → 수정 모드
        entryForm.dataset.editIdx = realIdx;
        amountInput.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // ===== 삭제 =====
      function deleteEntry(realIdx) {
        if (realIdx < 0 || realIdx >= entries.length) return;
        if (!confirm('이 내역을 삭제하시겠습니까?')) return;
        entries.splice(realIdx, 1);
        saveData();
        renderAll();
      }

      // ===== 추가 / 수정 제출 =====
      function handleSubmit(e) {
        e.preventDefault();
        const amount = Number(amountInput.value);
        if (!amount || amount <= 0) {
          alert('금액을 입력해주세요.');
          return;
        }
        if (!contentInput.value.trim() && !dateInput.value) {
          // 날짜는 필수, 내용은 필수가 아님
        }
        if (!dateInput.value) {
          alert('날짜를 선택해주세요.');
          return;
        }

        const data = {
          type: isIncome ? 'income' : 'expense',
          amount: amount,
          category: categorySel.value,
          content: contentInput.value.trim(),
          date: dateInput.value
        };

        const editIdx = entryForm.dataset.editIdx;
        if (editIdx !== undefined) {
          // 수정
          const idx = Number(editIdx);
          if (idx >= 0 && idx < entries.length) {
            entries[idx] = data;
          }
          delete entryForm.dataset.editIdx;
        } else {
          // 추가
          entries.push(data);
        }

        saveData();
        renderAll();
        entryForm.reset();
        dateInput.value = todayISO();
        amountInput.value = '';
        contentInput.value = '';
        amountInput.focus();
      }
      entryForm.addEventListener('submit', handleSubmit);

      // ===== 월 이동 =====
      function goMonth(delta) {
        viewMonth += delta;
        if (viewMonth < 0) {
          viewMonth = 11;
          viewYear -= 1;
        } else if (viewMonth > 11) {
          viewMonth = 0;
          viewYear += 1;
        }
        renderAll();
      }
      prevBtn.addEventListener('click', () => goMonth(-1));
      nextBtn.addEventListener('click', () => goMonth(1));

      // ===== 렌더링 전체 =====
      function renderAll() {
        monthLabel.textContent = `${viewYear}년 ${MONTH_NAMES[viewMonth]}`;
        renderSummary();
        renderList();
      }

      // ===== 샘플 데이터 =====
      function addSampleData() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth()+1).padStart(2,'0');
        const d = String(today.getDate()).padStart(2,'0');
        const todayStr = `${y}-${m}-${d}`;

        const samples = [
          { type:'income', amount:3200000, category:'salary', content:'11월 급여', date:todayStr },
          { type:'expense', amount:45000, category:'food', content:'마트 장보기', date:todayStr },
          { type:'expense', amount:12000, category:'transport', content:'지하철/버스', date:todayStr },
          { type:'expense', amount:89000, category:'housing', content:'월세', date:todayStr },
          { type:'expense', amount:15000, category:'culture', content:'영화 관람', date:todayStr },
          { type:'expense', amount:32000, category:'shopping', content:'의류 구매', date:todayStr },
          { type:'expense', amount:7500, category:'medical', content:'약국', date:todayStr },
          { type:'income', amount:500000, category:'allowance', content:'용돈', date:todayStr },
          { type:'expense', amount:66000, category:'communication', content:'휴대폰 요금', date:todayStr },
          { type:'expense', amount:200000, category:'education', content:'온라인 강의', date:todayStr },
        ];

        // 이전 달 샘플도 약간
        const lastMonth = new Date(y, m !== '01' ? today.getMonth() : 11, 15);
        const ly = lastMonth.getFullYear();
        const lm = String(lastMonth.getMonth()+1).padStart(2,'0');
        const ld = String(lastMonth.getDate()).padStart(2,'0');
        const lastStr = `${ly}-${lm}-${ld}`;

        samples.push(
          { type:'income', amount:3100000, category:'salary', content:'10월 급여', date:lastStr },
          { type:'expense', amount:52000, category:'food', content:'외식', date:lastStr },
          { type:'expense', amount:11000, category:'transport', content:'택시', date:lastStr },
          { type:'expense', amount:45000, category:'shopping', content:'생필품', date:lastStr }
        );

        // 중복 방지를 위해 같은 날짜+내용이 있으면 스킵
        samples.forEach(s => {
          const exists = entries.some(e => e.date === s.date && e.content === s.content && e.amount === s.amount);
          if (!exists) entries.push(s);
        });

        entries.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveData();
        renderAll();
        alert('샘플 데이터가 추가되었습니다.');
      }
      btnAddSample.addEventListener('click', addSampleData);

      // ===== 전체 삭제 =====
      btnClearAll.addEventListener('click', () => {
        if (entries.length === 0) {
          alert('삭제할 데이터가 없습니다.');
          return;
        }
        if (!confirm('모든 가계부 데이터를 삭제합니다. 정말 진행하시겠습니까?')) return;
        entries = [];
        saveData();
        renderAll();
        alert('모든 데이터가 삭제되었습니다.');
      });

      // ===== 초기화 =====
      function init() {
        loadData();
        dateInput.value = todayISO();
        setType(true);
        // 현재 달로 맞춰 뷰 설정
        viewYear = todayISO().slice(0,4);
        viewMonth = todayISO().slice(5,7);
        viewMonth = parseInt(viewMonth, 10) - 1;
        renderAll();

        // 달 변경 시 오늘 날짜 입력이 어색하지 않도록, 현재 달의 첫 날로 날짜 초기화 가능하게
        // 사용자가 직접 날짜를 선택하는 방식이므로 별도 처리 없음
      }
      init();
    })();
  </script>
</body>
</html>
